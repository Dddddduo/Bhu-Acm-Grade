# 只做两件事:打包网站 -> 发布到 GitHub Actions 构建并发布到 GitHub Pages
# 数据全部浏览器端实时抓取(CF 官方 API 直连,牛客 Rating / 总过题经 Cloudflare Worker 代理),
# 仓库里只有 public/data/members.json 一个手工数据文件,无快照
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:        # 本流程自己提交 dist/ 时不要再触发,避免空转
      - 'dist/**'
  workflow_dispatch: {}  # 也允许在 Actions 页面手动点 Run

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 把 dist/ 提交回仓库
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      # 打包产物入库:dist/ 保留在代码仓库里
      - name: 把 dist 提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "chore: 打包产物 dist"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
